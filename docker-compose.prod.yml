# 운영(EC2)용: MySQL + 앱. 실행 방법은 docs/deploy/EC2-배포.md
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# 값은 같은 폴더의 .env에서 읽는다 (.env.prod.example 참고). .env는 git에 올리지 않는다.
# 프로젝트 이름 고정: 안 정하면 폴더 이름(purchase-approval)이 되어 로컬용 docker-compose.yml과 같아진다.
# 그러면 볼륨 mysql-data 를 로컬 개발 DB와 같이 써 버린다 (맥에서 실제로 겪음, 트러블슈팅 09)
name: purchase-approval-prod

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-purchase}
      MYSQL_USER: ${DB_USERNAME:-purchase}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 적어 주세요}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD를 .env에 적어 주세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 메모리 1GB 서버에서 MySQL + 앱을 같이 돌리기 위해 줄인다 (기본값이면 MySQL만 400MB 넘게 씀)
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
    # ports를 열지 않는다: MySQL은 같은 compose 네트워크의 앱만 접근 (인터넷에서 3306 접속 불가)
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 앱은 MySQL이 "접속 가능"해진 뒤에 뜬다. 안 그러면 첫 기동 때 MySQL 초기화 중이라 연결 실패로 앱이 죽는다
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    image: ${APP_IMAGE:-ghcr.io/ikyoon0619/purchase-approval:latest}
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql                     # 컨테이너 안에서 localhost는 앱 자신. MySQL은 서비스 이름으로
      DB_NAME: ${DB_NAME:-purchase}
      DB_USERNAME: ${DB_USERNAME:-purchase}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      SAMPLE_DATA: ${SAMPLE_DATA:-false}
      NTS_SERVICE_KEY: ${NTS_SERVICE_KEY:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -Duser.timezone=Asia/Seoul}
    ports:
      - "80:8080"                        # 브라우저 http://서버주소 → 컨테이너 8080
    volumes:
      - uploads:/app/uploads             # 첨부파일. 컨테이너를 새 이미지로 바꿔도 남는다
    mem_limit: 640m

volumes:
  mysql-data:
  uploads:
