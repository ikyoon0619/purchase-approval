plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17   // JDK 17 이상이면 빌드된다
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 9단계: 매일 밤 통계 집계·결재 지연 알림·거래처 상태 갱신 (실행 이력은 BATCH_ 테이블에 남는다)
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    // 10단계: @Audited 감사 로그를 AOP로
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // Thymeleaf 공통 레이아웃 (layout:decorate)
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'

    // QueryDSL: 동적 검색 조건을 자바 코드로 작성. Q클래스는 컴파일할 때 자동 생성된다
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // 엑셀 다운로드 (SXSSF: 행을 디스크로 흘려 써서 행이 많아도 메모리를 적게 쓴다)
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 11단계: 운영 DB 스키마는 Flyway 마이그레이션(src/main/resources/db/migration)으로 관리. prod 프로필에서만 켠다
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    archiveFileName = 'app.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 생성된 Q클래스 위치를 고정해 두면 IntelliJ에서도 바로 인식된다
def generated = 'build/generated/querydsl'
tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = file(generated)
    options.encoding = 'UTF-8'
}
clean {
    delete file(generated)
}
