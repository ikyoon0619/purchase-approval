name: Deploy

# main에 머지되면: 테스트 → 이미지를 GitHub Container Registry(ghcr.io)에 올림 → (설정했다면) EC2에 배포
on:
  push:
    branches: [ main ]
  workflow_dispatch:          # Actions 화면에서 수동 실행

permissions:
  contents: read
  packages: write             # ghcr.io에 이미지 올리기 (GITHUB_TOKEN으로 충분, 따로 토큰 불필요)

concurrency:
  group: deploy
  cancel-in-progress: false   # 배포 도중에 다음 배포가 끼어들지 않게 줄 세운다

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest: EC2가 받는 이미지 / 커밋 해시: 문제가 생기면 이전 버전으로 되돌릴 때 쓴다
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # 저장소 Settings → Secrets and variables → Actions → Variables 에 DEPLOY_ENABLED=true 를 만들어야 돈다.
    # EC2를 아직 안 만들었으면 이 단계는 건너뛴다(실패 아님)
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" 'cd ~/purchase-approval && ./deploy/deploy.sh'
