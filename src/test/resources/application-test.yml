# 테스트: 메모리 H2를 MySQL 모드로 띄운다. 테스트가 끝나면 사라진다.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        generate_statistics: true   # 테스트에서 실행된 쿼리 수를 세기 위해 (N+1 확인)
