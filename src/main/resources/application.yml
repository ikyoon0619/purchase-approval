spring:
  application:
    name: purchase-approval
  config:
    # 프로젝트 폴더의 .env(키=값)를 설정으로 읽는다. 없으면 무시. DB 비밀번호, 국세청 API 키를 여기에 둔다
    import: optional:file:.env[.properties]
  profiles:
    default: local          # 프로필을 안 정하면 local(MySQL)로 뜬다
  jpa:
    # OSIV(Open Session In View) 끔: DB 커넥션을 화면을 다 그릴 때까지 붙잡지 않는다.
    # 대신 화면에 필요한 데이터는 서비스(트랜잭션) 안에서 다 읽어 와야 한다 (docs/troubleshooting/03)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # 지연 로딩할 때 같은 종류의 엔티티/컬렉션을 IN 절로 최대 100개씩 묶어서 읽는다 (N+1 → 1)
        # docs/troubleshooting/02 참고
        default_batch_fetch_size: 100
        query:
          # 컬렉션 fetch join + 페이징을 쓰면 경고만 찍고 전체를 메모리에 올려 자르는데, 이걸 아예 오류로 만든다
          fail_on_pagination_over_collection_fetch: true
  data:
    web:
      pageable:
        one-indexed-parameters: true   # 주소의 ?page=1 이 첫 페이지 (화면에 보이는 번호와 같게)
        default-page-size: 10
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 10MB       # 첨부 한 개 (REQ-03)
      max-request-size: 50MB    # 한 번에 올리는 전체 (5개 × 10MB)
  thymeleaf:
    cache: false            # 화면 수정 후 새로고침만 하면 바로 반영

app:
  upload-dir: ${UPLOAD_DIR:./uploads}   # 첨부파일 저장 위치
  nts:                                  # 국세청 사업자등록 상태조회 (공공데이터포털)
    base-url: https://api.odcloud.kr/api/nts-businessman/v1
    service-key: ${NTS_SERVICE_KEY:}    # 비어 있으면 호출하지 않고 "확인 안 됨"으로 저장
    connect-timeout: 2s
    read-timeout: 3s

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    org.hibernate.SQL: debug   # 실행되는 SQL을 로그로 본다 (N+1 확인용)

---
# 로컬 개발: docker compose로 띄운 MySQL
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:purchase}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sessionVariables=innodb_lock_wait_timeout=5   # 재고 행 잠금을 5초까지만 기다림 (기본 50초)
    username: ${DB_USERNAME:purchase}
    password: ${DB_PASSWORD:purchase}
  jpa:
    hibernate:
      # update: 엔티티에 맞춰 테이블을 만들고 컬럼을 추가한다. 데이터는 지우지 않는다.
      # create로 두면 재시작할 때마다 테이블을 지우고 새로 만들어 데이터가 사라진다 (docs/troubleshooting 참고)
      ddl-auto: update
