<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>대시보드</title>
</head>
<body>
<main layout:fragment="content">
    <h1>대시보드</h1>
    <p class="muted">프로젝트 뼈대 확인용 화면입니다. DB에서 읽은 조직도를 보여 줍니다.</p>

    <section class="card">
        <h2>부서 <span class="badge" th:text="${departments.size()}">0</span></h2>
        <table class="table">
            <thead>
            <tr><th>코드</th><th>부서명</th><th>상위 부서</th></tr>
            </thead>
            <tbody>
            <tr th:each="d : ${departments}">
                <td th:text="${d.code}">D100</td>
                <td th:text="${d.name}">경영지원본부</td>
                <td th:text="${d.parent != null ? d.parent.name : '-'}">-</td>
            </tr>
            <tr th:if="${departments.isEmpty()}">
                <td colspan="3" class="muted">부서가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="card">
        <h2>직급</h2>
        <p>
            <span class="chip" th:each="p : ${positions}" th:text="${p.name}">사원</span>
        </p>
    </section>
</main>
</body>
</html>
