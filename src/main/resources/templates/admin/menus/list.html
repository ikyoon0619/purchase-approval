<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>메뉴 권한</title></head>
<body>
<main layout:fragment="content">
    <h1>메뉴 권한</h1>
    <p class="muted">체크한 역할만 메뉴가 보이고, 주소를 직접 입력해도 들어갈 수 있습니다. 관리자 메뉴의 관리자 권한은 뺄 수 없습니다.</p>
    <form class="card" th:action="@{/admin/menus}" method="post">
        <table class="table">
            <thead>
            <tr><th>메뉴</th><th>주소</th><th th:each="r : ${roles}" th:text="${r.label}" class="center">직원</th></tr>
            </thead>
            <tbody>
            <tr th:each="m : ${menuList}">
                <td><span th:text="${m.name}">대시보드</span>
                    <input type="hidden" name="menuIds" th:value="${m.id}"></td>
                <td><code th:text="${m.url}">/</code></td>
                <td th:each="r : ${roles}" class="center">
                    <input type="checkbox" th:name="|menu_${m.id}|" th:value="${r}" th:checked="${m.isAllowed(r)}">
                </td>
            </tr>
            </tbody>
        </table>
        <div class="actions"><button type="submit" class="btn">저장</button></div>
    </form>
</main>
</body>
</html>
